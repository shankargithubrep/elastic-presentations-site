<style>
:root{--blue:#0B64DD;--ink:#1D1E24;--char:#343741;--grey:#69707D;--line:#D3DAE6;--pink:#F04E98;--teal:#48EFCF;--yellow:#FEC514;--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:#fff;color:var(--ink);font-family:var(--sans);display:grid;place-items:center;padding:16px;
  background-image:radial-gradient(rgba(29,30,36,.12) 1px,transparent 1.2px);background-size:22px 22px}
.card{width:min(440px,100%);background:#fff;padding:34px 34px 28px;border-top:3px solid var(--blue);

.logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.logo i{display:grid;grid-template-columns:repeat(2,8px);gap:2px}.logo i b{width:8px;height:8px;border-radius:50%}
.eb{margin-top:26px;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey)}
h1{margin:8px 0 6px;font-size:28px;line-height:1.15;letter-spacing:-.6px}h1 span{color:var(--blue)}
p{margin:0 0 20px;color:var(--char);font-size:14.5px;line-height:1.5}
label{display:block;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--grey);margin-bottom:6px}
input[type=password]{width:100%;font:500 16px var(--sans);padding:11px 12px;border:1.5px solid var(--line);border-radius:4px;outline:none}
input[type=password]:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,100,221,.15)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.rem{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--char)}
button{font:600 15px var(--sans);color:#fff;background:var(--blue);border:0;border-radius:4px;padding:11px 22px;cursor:pointer}
button:disabled{opacity:.6;cursor:progress}button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.err{min-height:20px;margin-top:12px;font-size:13px;color:#BD271E}
.ft{margin-top:22px;padding-top:12px;border-top:1px solid var(--line);font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
